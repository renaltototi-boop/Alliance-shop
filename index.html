<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alliance Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky bar, wordmark panel, search + category chips, card grid, bottom sheets, full-screen admin */
:root{
  --bg:#F2F6FE; --surface:#FFFFFF; --surface2:#E7EEFC; --ink:#0A1A3F; --ink2:#52638A; --line:#D3DFF5;
  --accent:#1F5BFF; --accent-ink:#FFFFFF; --accent-soft:#DBE6FF; --grid:rgba(31,91,255,.08);
  --glow:rgba(31,91,255,.22); --good:#0F7A57; --warn:#A8660B; --danger:#C23A30; --shadow:0 10px 30px rgba(15,40,110,.12);
  --f-display:'Unbounded','Onest',system-ui,sans-serif; --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060D21; --surface:#0D1938; --surface2:#142550; --ink:#EAF0FF; --ink2:#93A6D2; --line:#1F3266;
  --accent:#4C86FF; --accent-ink:#04122E; --accent-soft:#17306E; --grid:rgba(110,160,255,.07);
  --glow:rgba(76,134,255,.28); --good:#4ADBA6; --warn:#F0B35A; --danger:#FF7B70; --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060D21; --surface:#0D1938; --surface2:#142550; --ink:#EAF0FF; --ink2:#93A6D2; --line:#1F3266;
  --accent:#4C86FF; --accent-ink:#04122E; --accent-soft:#17306E; --grid:rgba(110,160,255,.07);
  --glow:rgba(76,134,255,.28); --good:#4ADBA6; --warn:#F0B35A; --danger:#FF7B70; --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0;-webkit-user-select:none;user-select:none}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px var(--glow)}
.logo svg{width:22px;height:22px}
.brand b{font:700 15px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600}
.cart-btn .n{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;padding:0 5px}
.cart-btn .n[hidden]{display:none}

/* wordmark panel */
.hero{margin-top:16px;border-radius:20px;padding:22px 20px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:
    radial-gradient(120% 140% at 100% 0%,var(--glow),transparent 55%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,
    var(--surface)}
.hero h1{margin:0;font:700 clamp(26px,7vw,40px)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{margin:10px 0 0;color:var(--ink2);max-width:46ch}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 12px 40px}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:7px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* products */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:14px}
.card{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.card h3{margin:0;font-size:16px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.badge{display:inline-block;margin-bottom:6px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font:500 11px/1.5 var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.spec{font:500 11.5px/1 var(--f-mono);color:var(--ink2);background:var(--surface2);border-radius:6px;padding:5px 7px}
.price{text-align:right;flex:none}
.price b{display:block;font:700 18px/1.1 var(--f-display);white-space:nowrap}
.price s{display:block;color:var(--ink2);font-size:12px;margin-top:3px;white-space:nowrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.stock{font-size:12.5px;color:var(--ink2)}
.stock.low{color:var(--warn)} .stock.out{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.step button{width:38px;height:38px;border:0;background:none;font-size:18px;font-weight:600}
.step span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:40px 12px;border:1px dashed var(--line);border-radius:16px}

/* bottom menu */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink2);font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--accent)}
.nav .dot{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.page{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.page h2.pt{margin:18px 0 4px;font:700 22px/1.15 var(--f-display)}
.addr{font:500 13px/1.45 var(--f-mono);word-break:break-all;background:var(--surface2);border-radius:10px;padding:10px 12px;user-select:all}
.amount{font:700 22px/1.1 var(--f-display);overflow-wrap:anywhere}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.faq{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.faq summary{font-weight:600;cursor:pointer}

/* game */
.slot{margin-top:12px;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(120% 90% at 50% 0%,var(--glow),transparent 62%),var(--surface)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reel{aspect-ratio:3/4;max-height:150px;border-radius:14px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font:700 clamp(44px,16vw,68px)/1 var(--f-display);color:var(--accent);overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:inset 0 8px 18px rgba(0,0,0,.12)}
.reel.spin span{filter:blur(1.2px);animation:reelTick .07s linear infinite}
.reel.stop{animation:reelStop .25s ease-out}
.slot.win .reel{border-color:var(--good);box-shadow:0 0 0 3px var(--accent-soft),0 0 28px var(--glow);animation:winPulse .7s ease-in-out 3}
@keyframes reelTick{from{transform:translateY(-12%)}to{transform:translateY(12%)}}
@keyframes reelStop{0%{transform:scale(1.08)}100%{transform:none}}
@keyframes winPulse{50%{transform:scale(1.06)}}
.slot-status{min-height:1.4em;text-align:center;font-weight:600;overflow-wrap:anywhere}
.slot-status.win{color:var(--good)}
.slot-meta{display:flex;justify-content:space-between;gap:10px;color:var(--ink2);font-size:13px}
/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(3,10,30,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;animation:rise .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sheet-h h2{margin:0;font:700 17px/1.2 var(--f-display);overflow-wrap:anywhere}
.sheet-b{padding:6px 18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.icon-btn{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(30px);opacity:.6}}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.line .nm{min-width:0;flex:1;overflow-wrap:anywhere;font-weight:500}
.line .nm small{display:block;color:var(--ink2);font-weight:400}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.total b{font:700 20px var(--f-display)}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:13.5px;overflow-wrap:anywhere}
.note.warn{color:var(--warn)}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:88vw;text-align:center;box-shadow:var(--shadow);animation:fade .15s}
.foot{padding:0 0 30px;color:var(--ink2);font-size:12.5px;text-align:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;color:var(--ink2);font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* admin */
.admin{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.admin-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.admin-bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.admin-bar h2{margin:0;font:700 15px var(--f-display)}
.state{font-size:12.5px;color:var(--ink2)} .state.dirty{color:var(--warn)}
.tabs{display:flex;gap:6px;padding-block:12px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:12px;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.arow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.arow.off{opacity:.55}
.arow{flex-wrap:wrap}
.arow .t{min-width:0;flex:1 1 100%}
.arow .acts{justify-content:flex-start}
.arow .t b{display:block;overflow-wrap:anywhere}
.arow .t small{color:var(--ink2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card-box h3{margin:0;font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-size:12.5px}
.menu-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.menu-item b{font-weight:600} .menu-item small{color:var(--ink2)}
.addr{font:500 12.5px/1.5 var(--f-mono);background:var(--surface2);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.paybox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);border-radius:14px;padding:14px;background:var(--surface)}
.paybox .big{font:700 18px/1.2 var(--f-display);overflow-wrap:anywhere}
/* motion */
.page{animation:pageIn .35s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes navIn{from{transform:translateY(100%)}}
.pre .bar,.pre .nav,.pre .page{opacity:0}
.in .bar{animation:fadeIn .5s both}
.in .nav{animation:navIn .5s .25s cubic-bezier(.2,.8,.3,1) both}
.in .hero{animation:up .6s both}
.in .controls{animation:up .6s .08s both}
.in .card{animation:up .5s both;animation-delay:calc(.14s + var(--i,0)*45ms)}
.card{transition:transform .2s,border-color .2s}
.card:active{transform:scale(.99)}
@media (hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--accent)}}
.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset:-40%;background:radial-gradient(closest-side,var(--glow),transparent);opacity:.45;animation:drift 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{from{transform:translate(-12%,8%)}to{transform:translate(14%,-6%)}}
.logo{position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:shine 5s 2.5s infinite}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.dot.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.toast{animation:up .25s}

/* intro: hooded blade-runner cuts the welcome text */
.splash{position:fixed;inset:0;z-index:80;overflow:hidden;display:grid;place-items:center;background:radial-gradient(90% 60% at 50% 45%,#0f2a66 0%,#07122e 55%,#030816 100%);color:#EAF0FF;transition:opacity .45s;cursor:pointer}
.splash.sp-out{opacity:0;pointer-events:none}
.sp-grid{position:absolute;inset:0;background:linear-gradient(rgba(110,160,255,.07) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,rgba(110,160,255,.07) 1px,transparent 1px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 15%,transparent 72%);mask-image:radial-gradient(circle at 50% 50%,#000 15%,transparent 72%)}
.sp-stage{position:relative;width:min(92vw,560px);animation:spIn .6s .15s both}
@keyframes spIn{from{opacity:0;transform:scale(.96)}}
.sp-text{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0;text-align:center}
.sp-top{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 38%,0 62%);animation:spTop 1.1s 1.36s cubic-bezier(.2,.7,.3,1) forwards}
.sp-bot{clip-path:polygon(0 62%,100% 38%,100% 100%,0 100%);animation:spBot 1.1s 1.36s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spTop{to{transform:translate(-22px,-30px) rotate(-3deg);opacity:0}}
@keyframes spBot{to{transform:translate(22px,30px) rotate(3deg);opacity:0}}
.sp-text small{font:500 clamp(12px,3.4vw,16px)/1.3 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:#9DB6EE}
.sp-text strong{font:700 clamp(26px,8.4vw,48px)/1.05 var(--f-display);margin-top:8px;color:#fff;text-shadow:0 0 30px rgba(76,134,255,.55);overflow-wrap:anywhere}
.sp-slash{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;clip-path:inset(-30% 100% -30% -30%);animation:spCut .42s 1.12s linear forwards,spGone .35s 1.6s forwards;filter:drop-shadow(0 0 8px #6EA0FF)}
@keyframes spCut{to{clip-path:inset(-30% -30% -30% -30%)}}
@keyframes spGone{to{opacity:0}}
.sp-flash{position:absolute;inset:0;background:#8fb4ff;opacity:0;animation:spFlash .4s 1.33s ease-out}
@keyframes spFlash{0%{opacity:0}15%{opacity:.35}100%{opacity:0}}
.sp-ass{position:absolute;left:0;top:calc(50% - 72px);width:min(48vw,200px);animation:spRun 1.2s .9s linear both;will-change:transform;filter:drop-shadow(0 0 1px #6EA0FF) drop-shadow(0 0 12px rgba(76,134,255,.7))}
.sp-ass svg{display:block;width:100%;height:auto}
.sp-ass.g1{opacity:.3;--fig:#4C86FF;animation-delay:.97s;filter:blur(2px)}
.sp-ass.g2{opacity:.15;--fig:#4C86FF;animation-delay:1.04s;filter:blur(3px)}
@keyframes spRun{from{transform:translate(-120%,54px) rotate(-7deg)}to{transform:translate(calc(100vw + 20%),-70px) rotate(-7deg)}}
.f{fill:var(--fig,#02050d)}
.fs{fill:none;stroke:var(--fig,#02050d);stroke-linecap:round;stroke-linejoin:round}
.sp-skip{position:absolute;left:50%;translate:-50% 0;bottom:calc(28px + env(safe-area-inset-bottom,0px));background:none;border:1px solid rgba(157,182,238,.4);color:#9DB6EE;border-radius:999px;padding:7px 16px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

function buildDoc(d){
  var reset='';var ss_=document.head.querySelectorAll('style');
  for(var i=0;i<ss_.length;i++){if(ss_[i].textContent.indexOf('[hidden]')>=0){reset=ss_[i].textContent;break}}
  if(!reset)reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var CLOSE='</scr'+'ipt>';
  var json=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +$('#app-title').outerHTML+'\n'+$('#app-meta').outerHTML+'\n'+$('#app-font').outerHTML+'\n'
    +'<style id="app-css">'+$('#app-css').textContent+'</style>\n'
    +'<div id="app"></div>\n'
    +'<script type="application/json" id="shop-data">'+json+CLOSE+'\n'
    +'<script id="app-js">'+$('#app-js').textContent+CLOSE
    +'</body></html>';
}
function ghCfg(){try{var o=JSON.parse(localStorage.getItem('ash_gh')||'null');if(o&&o.repo&&o.token)return o}catch(e){}return null}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
function ghHeaders(c){return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function ghUrl(c){return 'https://api.github.com/repos/'+c.repo+'/contents/data.json'}
function ghErr(e){
  var st=e&&e.status;
  if(st===401||st===403)return 'GitHub не принял токен. Проверь, что у токена есть доступ Contents: Read and write к этому репозиторию.';
  if(st===404)return 'Репозиторий не найден. Проверь название вида имя/репозиторий и доступ токена.';
  if(st===409||st===422)return 'Файл data.json успел измениться. Нажми «Опубликовать» ещё раз.';
  return 'Не получилось связаться с GitHub. Проверь интернет и попробуй ещё раз.';
}
async function publishGithub(){
  var c=ghCfg();publishing=true;A.pub.disabled=true;A.pub.textContent='Публикую…';
  try{
    var r=await fetch(ghUrl(c),{headers:ghHeaders(c),cache:'no-store'});var sha=null;
    if(r.ok){sha=(await r.json()).sha}else if(r.status!==404){var e1=new Error('get');e1.status=r.status;throw e1}
    var body={message:'Обновление магазина',content:b64(JSON.stringify(draft,null,1))};if(sha)body.sha=sha;
    r=await fetch(ghUrl(c),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(c)),body:JSON.stringify(body)});
    if(!r.ok){var e2=new Error('put');e2.status=r.status;throw e2}
    data=clone(draft);touch();
    toast('Опубликовано. Сайт обновится через 1-2 минуты.');
  }catch(e){toast(ghErr(e))}
  finally{publishing=false;A.pub.textContent='Опубликовать';updateBar()}
}
var publishing=false;
async function publish(){
  if(publishing||!dirty())return;
  var api=null;
  try{api=window.claude&&await window.claude.use('artifact')}catch(e){}
  if(!api){
    if(ghCfg()){return publishGithub()}
    toast('Укажи GitHub: Магазин → Публикация на сайте');return}
  publishing=true;A.pub.disabled=true;A.pub.textContent='Публикую…';
  try{await api.publish(buildDoc(draft))}
  catch(e){
    publishing=false;A.pub.textContent='Опубликовать';A.pub.disabled=false;
    var c=e&&e.code;
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled')toast('Опубликовать можно только из твоего аккаунта Claude. Открой ссылку магазина в приложении Claude.');
    else if(c==='rate_limited')toast('Слишком часто. Подожди минуту и повтори.');
    else if(c==='conflict')toast('Магазин обновили в другом месте. Страница перезагрузится.');
    else toast('Не получилось опубликовать. Попробуй ещё раз.');
  }
}
